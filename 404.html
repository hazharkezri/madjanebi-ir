<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>صفحه پیدا نشد | پخش لوازم جانبی ماد</title>
<style>
  *{ margin:0; padding:0; box-sizing:border-box; }
  body{
    font-family:'Vazirmatn',system-ui,sans-serif;
    background:#070B18; color:#fff; min-height:100vh;
    display:grid; place-items:center; text-align:center; padding:32px;
  }
  .num{ font-size:6rem; font-weight:900; background:linear-gradient(135deg,#F2D68A,#C9A227); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; line-height:1; }
  h1{ font-size:1.4rem; margin:18px 0 8px; }
  p{ color:rgba(255,255,255,.6); margin-bottom:28px; }
  a{
    display:inline-flex; align-items:center; gap:8px;
    background:linear-gradient(135deg,#F2D68A,#C9A227); color:#070B18;
    text-decoration:none; font-weight:800; padding:14px 30px; border-radius:14px;
  }
</style>
</head>
<body>
  <div>
    <div class="num">۴۰۴</div>
    <h1>صفحه مورد نظر پیدا نشد</h1>
    <p>ممکن است آدرس تغییر کرده باشد؛ به صفحه اصلی بازگردید.</p>
    <a href="/">بازگشت به صفحه اصلی</a>
  </div>
</body>
</html>
